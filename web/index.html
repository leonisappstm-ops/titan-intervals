  <!-- Built-in Web Audio Gym Tone Synthesizer -->
  <script>
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Auto-resume on user click
    window.addEventListener('click', function() {
      getAudioContext();
    }, { passive: true });

    window.playGymBeep = function(frequency, durationMs) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency || 800, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + ((durationMs || 150) / 1000));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + ((durationMs || 150) / 1000));
      } catch (err) {
        console.warn('Web Audio error:', err);
      }
    };

    window.playGymFanfare = function() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach(function(freq, i) {
        setTimeout(function() {
          window.playGymBeep(freq, 220);
        }, i * 140);
      });
    };

    window.gymStorageGet = function(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return null;
      }
    };

    window.gymStorageSet = function(key, val) {
      try {
        window.localStorage.setItem(key, val);
      } catch (e) {}
    };


  </script>
